<div class="app preview-off" id="app">
  <aside class="sidebar" aria-label="Agents and sessions">
    <div class="sidebar-mini" id="sidebarMini" aria-label="Collapsed navigation"><button class="sidebar-mini-button" id="sidebarMiniExpand" title="Expand the sidebar" data-icon="sidebar"></button><div class="sidebar-mini-separator"></div><button class="sidebar-mini-button" id="sidebarMiniWrite" title="Write mode" data-icon="edit"></button><button class="sidebar-mini-button" id="sidebarMiniSearch" title="Search" data-icon="search"></button><div class="sidebar-mini-separator"></div></div>
    <div class="side-head"><span class="brand">Agent Monitor <small>REAL MOCK</small></span><div class="head-actions"><button class="iconbtn" id="themeBtn" title="Toggle the theme"></button><button class="iconbtn sidebar-collapse" id="sidebarCollapse" title="Collapse the sidebar" data-icon="sidebar"></button></div></div>
    <nav class="nav" aria-label="Primary actions">
      <div class="navbtn write-control" id="writeBtn"><span data-icon="edit"></span><span class="label">Write mode</span><button class="write-info" id="writeInfo" title="About write mode" data-icon="info" hidden></button><button class="mode-switch" id="writeSwitch" role="switch" aria-label="Global write mode" aria-checked="false"><span></span></button></div>
      <div class="write-help" id="writeHelp" hidden></div>
      <button class="navbtn" id="searchBtn"><span data-icon="search"></span><span class="label">Search</span><span class="hint">⌘K</span></button>
    </nav>
    <div class="session-list" id="sessionList"></div>
  </aside>
  <div class="session-view preview-off" id="sessionView"></div>
</div>
<div class="search-layer" id="searchLayer"><div class="searchbox" role="dialog" aria-label="Search"><div class="search-input"><span data-icon="search"></span><input id="searchInput" placeholder="Go to an agent, project or session…" autocomplete="off"><span class="kbd">ESC</span></div><div class="search-results" id="searchResults"></div></div></div>
<div class="confirm-layer" id="confirmLayer"><div class="dialog"><h3>Allow writing to a live terminal？</h3><p id="confirmText"></p><div class="dialog-actions"><button class="smallbtn" id="cancelSend">Cancel</button><button class="smallbtn primary" id="confirmSend">Confirm and send</button></div></div></div>
<div class="toast" id="toast"></div>
