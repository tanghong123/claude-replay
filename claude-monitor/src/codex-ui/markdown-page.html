<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown</title>
<style>
:root{--bg:#fff;--ink:#20201f;--sub:#6f706d}
:root[data-theme="dark"]{--bg:#191918;--ink:#efefec;--sub:#a5a59f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#doc{height:100%}
#doc.unavailable{height:auto;max-width:36rem;margin:4rem auto;padding:0 1.5rem;color:var(--sub)}
</style>
</head>
<body data-mdrev="{{MDREV}}">
<div id="doc"></div>
<script type="module" src="/monitor-ui/markdown-page.js"></script>
</body>
</html>
