<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image</title>
<style>
:root{--bg:#f4f4f2;--ink:#20201f;--sub:#6f706d}
:root[data-theme="dark"]{--bg:#141413;--ink:#efefec;--sub:#a5a59f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#stage{height:100%;overflow:hidden;position:relative;touch-action:none}
#stage[data-pannable="yes"]{cursor:grab}
#stage[data-pannable="yes"].dragging{cursor:grabbing}
#stage>img{position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform;max-width:none;max-height:none;margin:0}
#stage.unavailable{height:auto;max-width:36rem;margin:4rem auto;padding:0 1.5rem;color:var(--sub)}
#stage.unavailable strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
</style>
</head>
<body>
<div id="stage"><img alt=""></div>
<script type="module" src="/monitor-ui/image-page.js"></script>
</body>
</html>
