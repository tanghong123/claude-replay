<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232e7d55'/><g fill='%23fff'><circle cx='9' cy='10' r='2'/><rect x='13' y='9' width='11' height='2' rx='1'/><circle cx='9' cy='16' r='2'/><rect x='13' y='15' width='11' height='2' rx='1'/><circle cx='9' cy='22' r='2'/><rect x='13' y='21' width='11' height='2' rx='1'/></g></svg>">
<title>claude-monitor</title>
<style>
  /* Palette + typography from the Session List design (light default, dark swap). */
  :root{
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --bg:#faf9f7;--fg:#26241f;--muted:#716a5c;--faint:#a69e8e;--border:#e6e1d5;
    --card:#f0ede3;--panel:#f4f2ec;--hover:#edeade;--tool:#2e7d55;--link:#3a6ea5;
    --kw:#6d4fa1;--gut:#b3ab9b;--amber:#b0842f;--addbg:#e5f1e2;--accent:#6d4fa1;
    /* #115: mirrors the embedded viewer's own --topbar-h (export.css) so the rail's
       header band and the viewer's topbar are the same height and end on one line. */
    --topbar-h:78px;
  }
  :root[data-theme="dark"]{
    --bg:#1b1915;--fg:#ece7dd;--muted:#a59c8c;--faint:#6f6656;--border:#322e27;
    --card:#232019;--panel:#201d17;--hover:#2b271f;--tool:#57b07a;--link:#7aa6d8;
    --kw:#ad93e3;--gut:#565040;--amber:#cf9f52;--addbg:#26352b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;background:var(--bg);color:var(--fg);font-family:var(--sans)}
  /* #137: the drag handle (#114) could squeeze the pane until the toolbar icons fell off
     the right edge. The floor is what the title row actually needs (measured: ~265px);
     CSS owns it and the drag reads it back, so there is no second copy to drift. */
  aside{width:326px;min-width:272px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
  /* #115: the rail's header and the embedded viewer's topbar are two halves of one bar,
     so they use ONE geometry — same total height, same 38px rows, same bottom border on
     the same line. Before this the two search boxes sat 15px apart and the eye read a
     stagger where there should be a single horizontal band. The token mirrors the
     viewer's own --topbar-h (export.css); the FILTER pills are rail-only and therefore
     live below the shared border, not inside the band. */
  #head{height:var(--topbar-h);flex:none;display:flex;flex-direction:column;justify-content:center;
        padding:0 15px;border-bottom:1px solid var(--border)}
  .railrow{display:flex;align-items:center;gap:9px;height:38px}
  #titlebar{display:flex;align-items:center;gap:9px}
  #titlebar b{font:700 15px var(--sans);letter-spacing:-.01em;display:block}
  /* #137: the version sits UNDER the wordmark. Side by side it cost ~46px of a pane the
     user can now drag narrow (#114), and the toolbar icons were what got pushed out. */
  #wordmark{flex:none;line-height:1.05}
  #ver{display:block;font:400 9.5px var(--mono);color:var(--faint)}
  .pill{flex:none;white-space:nowrap;font:10.5px var(--sans);color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:99px;padding:2px 9px;cursor:pointer}
  .pill:hover{background:var(--hover)}
  .picon{font:16px/1 var(--sans);padding:2px 9px}
  /* #131: ⊕/⊖ read as font-size controls. Doubled group chevrons instead — the same
     ▼-that-rotates the rows already use, so the icon names the thing it acts on. */
  .pchev{font:12px/1 var(--sans);letter-spacing:-1.5px;padding:3px 10px 3px 8px;color:var(--muted)}
  .pchev:hover{color:var(--fg)}
  #scan{font:9.5px var(--mono);color:var(--faint);display:inline-flex;align-items:center;gap:5px}
  #scan i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--tool);animation:mon-pulse 2.4s infinite}
  /* Same box as the viewer's search (export.css .searchbox): 6px radius, 28px input. */
  #searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:0 8px;background:var(--panel)}
  #searchbox span{color:var(--faint);font-size:12px}
  /* #132: "/" focuses this box, but nothing said so. Same cue the embedded view's search
     uses (export.css .searchbox:focus-within) — one vocabulary across both panes. */
  #searchbox:focus-within{border-color:var(--link);box-shadow:0 0 0 1px var(--link);background:var(--bg)}
  #searchbox:focus-within span{color:var(--link)}
  #search{flex:1;min-width:0;border:none;outline:none;background:transparent;font:13px var(--sans);color:var(--fg);height:28px}
  /* Rail-only, so it sits BELOW the band the two headers share (#115). */
  #filters{display:flex;flex-wrap:wrap;gap:5px;padding:10px 15px 8px}
  #filters button{font:11px var(--sans);padding:4px 12px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer}
  #filters button.on{border-color:var(--accent);background:var(--hover);color:var(--fg)}
  #list{flex:1;overflow-y:auto;padding:0 0 16px}
  #list::-webkit-scrollbar{width:9px}
  #list::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:3px solid var(--bg)}
  #list:hover::-webkit-scrollbar-thumb{background:var(--gut)}
  .ghead{position:sticky;top:0;z-index:2;background:var(--bg);padding:11px 15px 7px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .ghead:hover{background:var(--panel)}
  .chev{flex:none;font-size:9px;color:var(--faint);transition:transform .15s;display:inline-block;width:9px}
  .gcol .chev{transform:rotate(-90deg)}
  .glabels{min-width:0;display:flex;flex-direction:column;gap:1px}
  /* #130: the group header is the PARENT — it must read larger and heavier than the rows
     under it. It was 12.5px bold against 13.5px rows, so the child outranked the parent
     and the list read flat. */
  .glabel{font:700 13.5px var(--sans);color:var(--fg);letter-spacing:-.01em}
  .gsec{font:9.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gmeta{flex:none;font:9.5px var(--mono);color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:2px 8px;margin-left:auto}
  .gdot{flex:none;width:7px;height:7px;border-radius:50%}
  .gdot.growing{background:var(--tool)}
  .gdot.idle{background:var(--amber)}
  .gdot.finished{background:var(--gut)}
  .gkind{flex:none;font:8.5px var(--mono);color:var(--kw);border:1px solid var(--kw);border-radius:4px;padding:0 5px;opacity:.75;margin-left:2px;align-self:center}
  .term{flex:none;font:9px var(--mono);color:var(--link);border:1px solid var(--border);border-radius:4px;padding:0 5px;cursor:copy}
  .term:hover{border-color:var(--link);background:var(--hover)}
  .term.copied{color:var(--tool);border-color:var(--tool);background:var(--addbg)}
  .gterm{flex:none;font:9px var(--mono);color:var(--link);border:1px solid var(--link);border-radius:4px;padding:0 4px;opacity:.7}
  .row{margin:3px 10px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;outline:none}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--hover);border-color:var(--accent)}
  .row.grow{background:rgba(46,125,85,.08);border-color:rgba(46,125,85,.32)}
  .row.grow.sel{border-color:var(--accent)}
  .r1{display:flex;align-items:center;gap:9px}
  .dot{flex:none;width:9px;height:9px;border-radius:50%}
  .dot.growing{background:var(--tool);animation:mon-pulse 2.2s infinite}
  .dot.idle{background:var(--amber)}
  .dot.idle.unconfirmed{background:transparent;border:2px solid var(--amber)}
  .dot.finished{background:var(--gut)}
  .rname{flex:1;min-width:0;font:12px var(--sans);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{flex:none;font:9px var(--mono);color:var(--tool);background:var(--addbg);border-radius:99px;padding:1px 7px}
  .achip{flex:none;font:9px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 5px}
  .abadge{flex:none;font:8.5px/1 var(--mono);font-weight:600;border-radius:3px;padding:2px 3px;color:#fff}
  .abadge.a-claude{background:var(--kw)}
  .abadge.a-codex{background:var(--link)}
  .abadge.a-qoderwork{background:var(--tool)}
  .abadge.a-other{background:var(--gut)}
  .r2{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding-left:18px}
  .counters{min-width:0;font:10.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counters.unvisited{opacity:.65}
  .age{flex:none;font:10.5px var(--mono);color:var(--faint)}
  /* #142 fork family: the chip opens the family; members sit indented under it. */
  .forks{flex:none;font:9px var(--mono);color:var(--kw);background:transparent;border:1px solid var(--kw);
         border-radius:4px;padding:0 5px;opacity:.75;cursor:pointer}
  .forks:hover{opacity:1;background:var(--hover)}
  .row.forkrow{margin-left:26px;border-left:1px solid var(--border);border-radius:0 10px 10px 0}
  .showmore{margin:2px 10px 4px 28px;font:10.5px var(--sans);color:var(--link);cursor:pointer;user-select:none}
  .showmore:hover{text-decoration:underline}
  /* #113 hide/restore: a small control that appears on hover; a hidden item (revealed by the
     "Hidden (N)" toggle) renders greyed with its restore control always visible. */
  .rowx,.ghx{flex:none;font:13px/1 var(--sans);color:var(--faint);border:none;background:transparent;cursor:pointer;padding:1px 5px;border-radius:5px;opacity:0}
  .row:hover .rowx,.ghead:hover .ghx{opacity:.65}
  .rowx:hover,.ghx:hover{opacity:1;background:var(--hover);color:var(--fg)}
  .row.hidden{opacity:.5}
  .group.ghidden>.ghead{opacity:.55}
  .row.hidden .rowx,.group.ghidden>.ghead .ghx{opacity:.7}
  #hiddentoggle{display:none;margin-left:auto;font:11px var(--sans);padding:4px 12px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer}
  #hiddentoggle.on{border-color:var(--accent);background:var(--hover);color:var(--fg)}
  @keyframes mon-pulse{0%{box-shadow:0 0 0 0 rgba(46,125,85,.4)}70%{box-shadow:0 0 0 5px rgba(46,125,85,0)}100%{box-shadow:0 0 0 0 rgba(46,125,85,0)}}
  /* #114: adjustable rail width — a slim col-resize handle straddling the rail border. */
  #drag{flex:none;width:5px;margin:0 -2px 0 -3px;cursor:col-resize;z-index:5}
  #drag:hover,body.dragging #drag{background:var(--accent);opacity:.35}
  body.railless #drag{display:none}
  body.dragging{cursor:col-resize;user-select:none}
  body.dragging #view{pointer-events:none}
  #view{flex:1;min-width:0;border:none;background:var(--bg)}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;font:13px var(--sans);color:var(--faint)}
  /* Rail hidden: a slim strip carries the show-again control (the view's chrome belongs to
     the embedded page — never overlay it). */
  #strip{display:none;width:26px;flex:none;border-right:1px solid var(--border);background:var(--bg);flex-direction:column;align-items:center;padding-top:9px;gap:10px}
  #stripproj{writing-mode:vertical-rl;font:600 11px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(100vh - 60px);cursor:pointer}
  body.railless aside{display:none}
  body.railless #strip{display:flex}
  .toggle{font:600 15px/1 var(--sans);color:var(--fg);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer}
  .toggle:hover{background:var(--hover)}
</style>
</head>
<body>
<aside>
  <div id="head">
    <div id="titlebar" class="railrow">
      <span id="wordmark"><b>Monitor</b><span id="ver" title="claude-monitor version">v{{VERSION}}</span></span>
      <button class="pill pchev" id="collapseall" title="Collapse all groups">▸▸</button>
      <button class="pill pchev" id="expandall" title="Expand all groups">▾▾</button>
      <span style="flex:1"></span>
      <button class="pill picon" id="themebtn" title="Theme — set globally for the rail and the embedded view">◐</button>
      <span id="scan" title="live — the monitor re-scans every couple of seconds"><i></i></span>
      <button class="toggle" id="hiderail" title="Collapse the session list">«</button>
    </div>
    <div class="railrow"><div id="searchbox"><span>⌕</span><input id="search" placeholder="Filter sessions  ( / )" autocomplete="off"></div></div>
  </div>
  <div id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="growing">Active</button>
    <button data-f="idle">Idle</button>
    <button id="hiddentoggle" title="Show sessions, projects and agents you've hidden">Hidden</button>
  </div>
  <div id="list"></div>
</aside>
<div id="drag" title="Drag to resize the session list"></div>
<div id="strip"><button class="toggle" id="showrail" title="Show the session list">»</button><span id="stripproj" title="current project — click to show the list"></span></div>
<div id="empty">select a session</div>
<iframe id="view" style="display:none"></iframe>
<script>
(function(){
  "use strict";
  var THEME_KEY="claude-monitor-theme";
  var root=document.documentElement;
  var list=document.getElementById("list");
  var view=document.getElementById("view");
  var empty=document.getElementById("empty");
  var search=document.getElementById("search");
  var state={groups:[],sel:null,filter:"all",q:"",collapsed:{},expanded:{},famOpen:{},copied:null,dark:false,showHidden:false,ignoredCount:0};

  try{state.dark=localStorage.getItem(THEME_KEY)==="dark";}catch(e){}
  applyTheme(state.dark,false);

  // #114: adjustable rail width, persisted. The iframe goes pointer-events:none while
  // dragging (body.dragging) or it would swallow the mousemoves.
  var RAILW_KEY="claude-monitor-railw";
  var rail=document.querySelector("aside");
  // The floor comes from the stylesheet (#137) — the one place it is stated.
  var railMin=parseInt(getComputedStyle(rail).minWidth,10)||272;
  var clampW=function(w){return Math.max(railMin,Math.min(Math.max(railMin+48,window.innerWidth-360),w));};
  try{var rw=parseInt(localStorage.getItem(RAILW_KEY)||"",10);if(rw)rail.style.width=clampW(rw)+"px";}catch(e){}
  document.getElementById("drag").addEventListener("mousedown",function(e){
    e.preventDefault();
    document.body.classList.add("dragging");
    var mv=function(ev){rail.style.width=clampW(ev.clientX)+"px";};
    var up=function(){
      document.body.classList.remove("dragging");
      document.removeEventListener("mousemove",mv);
      document.removeEventListener("mouseup",up);
      try{localStorage.setItem(RAILW_KEY,parseInt(rail.style.width,10)||326);}catch(e2){}
    };
    document.addEventListener("mousemove",mv);
    document.addEventListener("mouseup",up);
  });

  // ── data ─────────────────────────────────────────────────────────────────
  function poll(){
    fetch("/api/sessions",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      state.groups=d.groups||[];state.ignoredCount=d.ignoredCount||0;render();
      if(!state.sel){var first=firstRow("growing")||firstRow(null);if(first){select(first.id,true);}}
    }).catch(function(){});
  }
  function firstRow(st){
    for(var g of state.groups){if(g.hidden)continue;for(var r of g.rows)if(!r.hidden&&(!st||r.state===st))return r;}
    return null;
  }
  function rowById(id){
    for(var g of state.groups)for(var r of g.rows)if(r.id===id)return r;
    return null;
  }
  function groupOf(id){
    for(var g of state.groups)for(var r of g.rows)if(r.id===id)return g;
    return null;
  }

  // ── render ───────────────────────────────────────────────────────────────
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function gMeta(g){
    var cost=(g.metaLine.indexOf("$")===0)?g.metaLine.split(" · ")[0]+" · ":"";
    return cost+g.total;  // the TRUE total, unaffected by a per-group row cap
  }
  function gStatusTip(g){
    var fin=g.total-g.growing-g.idle;
    var p=[];if(g.growing)p.push(g.growing+" active");if(g.idle)p.push(g.idle+" idle");if(fin)p.push(fin+" finished");
    return p.join(" · ")+"  ("+g.total+" total)";
  }
  function agentBadge(r){
    var a=(r.agent||"").toLowerCase();
    var code=a.indexOf("claude")>=0?"cc":a.indexOf("codex")>=0?"cx":a.indexOf("qoder")>=0?"qw":(r.agent||"?").slice(0,2);
    var cls=a.indexOf("claude")>=0?"a-claude":a.indexOf("codex")>=0?"a-codex":a.indexOf("qoder")>=0?"a-qoderwork":"a-other";
    return '<span class="abadge '+cls+'" title="'+esc(r.agent)+'">'+esc(code)+'</span>';
  }
  // #129/#138: a session's start→last-activity span, said the shortest true way.
  // Clock times only earn their space for a session you might still be in TODAY; one that
  // began and ended on some earlier day is just that day (never "8/5–8/5"); and a session
  // spanning days is its two dates. Carrying date AND time always overflowed the rail and
  // ellipsized away the cost behind it.
  function fmtSpan(a,b){
    if(!a||!b)return null;
    var da=new Date(a*1000),db=new Date(b*1000);
    var hm=function(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
    var md=function(d){return (d.getMonth()+1)+"/"+d.getDate();};
    if(da.toDateString()!==db.toDateString())return md(da)+"–"+md(db);
    return da.toDateString()===new Date().toDateString() ? hm(da)+"–"+hm(db) : md(da);
  }
  function subLine(r,g){
    if(g&&g.kind!=="agent"){
      // #129: project sessions — span, subagent count, dollars (in that order);
      // turns/tools stay for desktop-agent rows only.
      var pp=[];
      var span=fmtSpan(r.startTs,r.activityTs);
      if(span)pp.push(span);
      if(r.visited){
        if(r.subs)pp.push(r.subs+" sub");
        if(r.cost!=null)pp.push("$"+r.cost.toFixed(2));
      }
      return pp.length?pp.join(" · "):"tbd";
    }
    if(!r.visited)return "tbd";
    var parts=[r.turns+" turns",r.tools+" tools"];
    if(r.subs)parts.push(r.subs+" sub");
    if(r.cost!=null)parts.push("$"+r.cost.toFixed(2));
    return parts.join(" · ");
  }
  // #148 (design/compose-to-terminal.md §5.1): the R8-safe half of "reach this session" —
  // hand the user the command that ATTACHES to it and let them run it themselves. The
  // monitor still only NAMES the target; nothing is sent anywhere.
  //
  // A pane id resolves as a target-session (verified: `has-session -t %0` exits 0), so the
  // socket and pane the row already carries are enough — no extra read of another tmux
  // server, which keeps this purely presentational.
  function attachCmd(r){
    if(r.term==="screen")return "screen -r "+r.target;
    if(r.term!=="tmux")return null;
    return "tmux "+(r.sock?"-L "+r.sock+" ":"")+"attach -t "+r.target;
  }
  function copyText(t){
    // The API can be PRESENT and still reject — it needs a focused document and a trusted
    // gesture — so the fallback hangs off the rejection, not off feature detection. Getting
    // that wrong is what made the first version report failure on a perfectly good copy
    // (and is the same trap #81 fixed in the viewer).
    var legacy=function(){
      return new Promise(function(res,rej){
        var a=document.createElement("textarea");
        a.value=t;a.style.position="fixed";a.style.opacity="0";
        document.body.appendChild(a);a.select();
        var ok=false; try{ok=document.execCommand("copy");}catch(e){}
        a.remove(); ok?res():rej();
      });
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      return navigator.clipboard.writeText(t).catch(legacy);
    }
    return legacy();
  }
  function termTip(r){
    // Named, never used: the monitor is read-only — this says WHERE the agent lives.
    var t=r.term==="tmux"
      ?"live agent pid "+r.pid+" in a controllable tmux pane "+r.target+(r.sock?" on server -L "+r.sock:"")
      :"live agent pid "+r.pid+" in a controllable screen session "+r.target;
    // #145: the pane is certain; WHOSE pane it is may not be. An unconfirmed link was
    // matched by directory, and that directory holds more than one session.
    if(r.conf==="unconfirmed"&&r.ambig>1){
      t+=" — matched by directory, which holds "+r.ambig+" sessions, so this terminal may belong to another of them";
    }
    var c=attachCmd(r);
    if(c)t+="\n\nClick to copy:  "+c;
    return t;
  }
  function rowTitle(r){
    // #145: an idle row linked by cwd is the COMMON case — most agents are launched without
    // a session id — so the tooltip says what is actually known rather than just "unconfirmed".
    // When the directory holds several sessions the count is the size of the doubt: `--resume`
    // offers a picker, so the live agent may be driving any of them.
    var t=r.state==="growing"?"growing — the transcript grew since the last scan"
      :r.state==="idle"?(r.conf==="unconfirmed"
        ?(r.ambig>1
          ?"idle · a live agent is in this directory — but it was started without a session id, "
            +"and `--resume` picks from a list, so it may be driving any of these "+r.ambig+" sessions"
          :"idle · alive — the only session in this directory, and a live agent is in it")
        :"idle · alive — a live process names this session")
      :"finished — no growth, no process";
    if(!r.visited)t+="  ·  counters appear after first open (lazy fold)";
    return t;
  }
  // #142: fork families. Forking COPIES the conversation, so a family's members are
  // 82–99% the same transcript; the rail shows ONE row for the family and opens to the
  // rest. The server tags every row with its family root (a session with no forks is a
  // family of one), so grouping here is one rule rather than two.
  //
  // The row shown is the ROOT — forks are titled "<root title> (Fork)", so the root names
  // the family — but its STATE and ACTIVITY are the max over members: a family is active
  // if any member is, and a root can be older than the fork that continued past it.
  // Counters are deliberately NOT summed: 82–99% of every fork replays the root, so adding
  // them would count the same tokens once per member.
  // #153: what counts as ONE row. For most agents that is the fork family (#142). For
  // QoderWork it is the TITLE: measured, its 37 sessions carry 19 distinct titles, and six
  // titles span SEPARATE fork families — four sessions of one interview-prep task in four
  // families — which family grouping cannot merge because they are not forks of each other.
  // A title is a label rather than an identity, so two genuinely distinct chats sharing a
  // name will cluster; they are indistinguishable to the reader anyway, and the row expands.
  function clusterKey(r){
    if((r.agent||"").toLowerCase().indexOf("qoder")>=0){
      var t=(r.name||"").replace(" (Fork)","").trim();
      if(t)return "t:"+t;
    }
    return r.family||r.id;
  }
  function families(rows){
    var by={},order=[];
    for(var r of rows){
      var k=clusterKey(r);
      if(!by[k]){by[k]={key:k,rep:null,members:[],latest:0,growing:false};order.push(k);}
      var f=by[k];
      f.members.push(r);
      if((r.activityTs||0)>f.latest)f.latest=r.activityTs||0;
      if(r.state==="growing")f.growing=true;
      if(!r.isFork&&!f.rep)f.rep=r;
    }
    return order.map(function(k){
      var f=by[k];
      // No root among the visible members (filtered out, or its transcript is gone):
      // the most recently active member speaks for the family.
      if(!f.rep){
        f.rep=f.members.slice().sort(function(a,b){return (b.activityTs||0)-(a.activityTs||0)})[0];
      }
      return f;
    });
  }
  function rowHtml(r,g,fam){
    var members=fam?fam.members.length:1;
    // The family's state, not just the representative's.
    var st=(fam&&fam.growing)?"growing":r.state;
    var cls="row"+(st==="growing"?" grow":"")+(state.sel===r.id?" sel":"")
      +(r.hidden?" hidden":"")+(fam?"":" forkrow");
    var dot="dot "+st+(r.conf==="unconfirmed"&&r.ambig>1?" unconfirmed":"");
    // #113: a row hidden by its OWN key gets a restore; a visible row gets a hide. A row
    // hidden because its whole GROUP is hidden shows nothing — the group header owns it.
    var rowx=g.hidden?""
      :(r.hidden
        ?'<button class="rowx" data-show="'+esc(r.ignoreKey)+'" title="Restore this session">↩</button>'
        :'<button class="rowx" data-hide="'+esc(r.ignoreKey)+'" title="Hide this session">×</button>');
    var forks=members>1
      ?'<button class="forks" data-fam="'+esc(fam.key)+'" title="'+(members-1)+' fork'+(members>2?"s":"")
        +' of this session — forking copies the conversation, so they overlap heavily">⑂ '+(members-1)
        +(state.famOpen[fam.key]?" ▾":"")+'</button>'
      :"";
    return '<div class="'+cls+'" tabindex="0" data-id="'+esc(r.id)+'" title="'+esc(rowTitle(r))+'">'
      +'<div class="r1"><span class="'+dot+'"></span>'
      +agentBadge(r)
      +'<span class="rname">'+esc(r.name)+'</span>'
      +(r.visited&&r.child?'<span class="live">↳ live</span>':"")
      +(r.target?'<span class="term'+(state.copied&&state.copied.id===r.id?" copied":"")+'" data-attach="'+esc(attachCmd(r)||"")+'" title="'+esc(termTip(r))+'">'
    +(state.copied&&state.copied.id===r.id?(state.copied.ok?"copied":"⌘C it"):"&gt;_ "+esc(r.term))+'</span>':"")
      +forks+rowx
      +'</div><div class="r2"><span class="counters'+(r.visited?"":" unvisited")+'">'+esc(subLine(r,g))+'</span>'
      +'<span class="age">'+esc(fam?famActivity(fam,r):r.activity)+'</span></div></div>';
  }
  // The family's age is its most recent member's, so a family with a live fork never reads stale.
  function famActivity(fam,rep){
    if(fam.members.length<2)return rep.activity;
    var newest=fam.members[0];
    for(var m of fam.members)if((m.activityTs||0)>(newest.activityTs||0))newest=m;
    return newest.activity;
  }
  function capOf(g){return g.kind==="agent"?7:3;}
  function render(){
    var scroll=list.scrollTop;
    var html="";
    for(var g of state.groups){
      if(g.hidden&&!state.showHidden)continue;  // #113: a hidden group vanishes until revealed
      var gkey=g.kind+":"+g.label+":"+g.secondary;
      var collapsed=!!state.collapsed[gkey];
      var expanded=!!state.expanded[gkey];
      var multi=g.rows.some(function(r){return r.agent!==g.rows[0].agent})&&g.kind!=="agent";
      var vis=g.rows.filter(function(r){
        var okHidden=state.showHidden||!r.hidden;
        var okState=state.filter==="all"||r.state===state.filter;
        var okText=!state.q||(r.name+" "+g.label+" "+r.agent).toLowerCase().indexOf(state.q)>=0;
        return okHidden&&okState&&okText;
      });
      // #142: the cap counts FAMILIES, not sessions — otherwise a 10-fork family fills the
      // whole group and its own members are what "show more" reveals.
      var fams=families(vis);
      var cap=capOf(g), hidden=0;
      if(!expanded&&fams.length>cap){
        var active=fams.filter(function(f){return f.growing;});
        var keep=Math.max(cap,active.length);
        hidden=fams.length-keep;
        fams=fams.slice(0,keep);
      }
      var rowsHtml="",any=fams.length>0;
      // #150: a collapsed group still shows the SELECTED session, so "which project is this
      // one in?" is answerable with everything collapsed — otherwise the rail becomes a list
      // of headers with nothing marking the one you have open. Taken from g.rows rather than
      // the filtered/capped set: selecting a session is an explicit act and outranks a filter
      // that would otherwise hide the very row being viewed.
      if(collapsed){
        var selRow=g.rows.filter(function(r){return r.id===state.sel;})[0];
        if(selRow)rowsHtml+=rowHtml(selRow,g,null);
      }
      for(var fam of fams){
        if(collapsed)continue;
        rowsHtml+=rowHtml(fam.rep,g,fam);
        // #142: an OPEN family lists its other members, indented. The forks are real
        // sessions with divergent tails — reachable, never dropped.
        if(fam.members.length>1&&state.famOpen[fam.key]){
          for(var m of fam.members){
            if(m.id===fam.rep.id)continue;
            rowsHtml+=rowHtml(m,g,null);
          }
        }
      }
      if(!any&&!collapsed)continue;
      if(!collapsed&&(hidden>0||expanded)){
        rowsHtml+="<div class=\"showmore\" data-more=\""+esc(gkey)+"\">"+(expanded?"show less":"show "+hidden+" more")+"</div>";
      }
      var ghx=g.hidden
        ?'<button class="ghx" data-show="'+esc(g.ignoreKey)+'" title="Restore this '+(g.kind==="agent"?"agent":"project")+'">↩</button>'
        :'<button class="ghx" data-hide="'+esc(g.ignoreKey)+'" title="Hide this '+(g.kind==="agent"?"agent":"project")+'">×</button>';
      html+='<div class="group'+(collapsed?" gcol":"")+(g.hidden?" ghidden":"")+'" data-g="'+esc(gkey)+'">'
        +'<div class="ghead"><span class="chev">▼</span>'
        +'<span class="gdot '+(g.growing?'growing':g.idle?'idle':'finished')+'" title="'+esc(gStatusTip(g))+'"></span>'
        +'<div class="glabels"><span class="glabel">'+esc(g.label)+'</span>'
        +'<span class="gsec">'+esc(g.secondary)+'</span></div>'
        +(g.kind==="agent"?'<span class="gkind">desktop</span>':"")
        +(g.hasTerm?'<span class="gterm" title="a live agent in this project is in a controllable terminal">&gt;_</span>':"")
        +'<span class="gmeta" title="'+esc(gStatusTip(g))+'">'+esc(gMeta(g))+'</span>'
        +ghx+'</div>'
        +rowsHtml+'</div>';
    }
    list.innerHTML=html;
    list.scrollTop=scroll;
    // #113: the reveal toggle only appears once something is hidden.
    var ht=document.getElementById("hiddentoggle");
    if(state.ignoredCount>0){
      ht.style.display="inline-block";ht.textContent="Hidden ("+state.ignoredCount+")";
      ht.classList.toggle("on",state.showHidden);
    }else{ht.style.display="none";state.showHidden=false;ht.classList.remove("on");}
  }

  // ── selection / navigation ───────────────────────────────────────────────
  function frameSrc(id){
    return "/session?id="+encodeURIComponent(id)+"&chrome=embed&theme="+(state.dark?"dark":"light");
  }
  // #136: where you were in each session, remembered across switches. IN MEMORY ONLY —
  // this is the live tab's state, not a preference, so a reload starts clean.
  var viewport={};   // session id → scrollY
  var chase=null;    // {id, y, until} while a restore is being pursued
  // Key by the session PARAM, not the iframe URL: the URL also carries the theme (so a
  // theme toggle would orphan the entry) and a sub-agent drill-down keeps `dataset.sid`
  // while showing a different session — the param is the identity that matters.
  function viewKey(){
    try{
      var q=new URLSearchParams(view.contentWindow.location.search);
      return q.get("session")||q.get("id")||view.dataset.sid||"";
    }catch(e){return view.dataset.sid||"";}
  }
  function rememberViewport(){
    var k=viewKey();
    if(!k)return;
    try{viewport[k]=view.contentWindow.scrollY;}catch(e){}
  }
  // Two things move the target after load and BOTH must be outlasted: the document grows
  // as blocks stream in (an early scrollTo clamps against a page that is not tall enough
  // yet), and the viewer then pins itself to the bottom to follow live. So re-assert until
  // the position HOLDS — landing on it once and stopping just hands the page back.
  function chaseViewport(){
    if(!chase)return;
    if(chase.id!==view.dataset.sid||Date.now()>chase.until){chase=null;return;}
    try{
      var w=view.contentWindow;
      if(Math.abs(w.scrollY-chase.y)<=2){
        if(++chase.held>=4){chase=null;return;}   // ~240ms undisturbed: it stuck
      }else{
        chase.held=0;
        w.scrollTo(0,chase.y);
      }
    }catch(e){chase=null;return;}
    setTimeout(chaseViewport,60);
  }
  // A sub-agent nav inside the view uses a relative ?session= href that drops the theme
  // param (#124). The view is same-origin, so stamp the monitor's theme on every load —
  // the same data-theme attribute the theme param sets.
  view.addEventListener("load",function(){
    try{view.contentDocument.documentElement.setAttribute("data-theme",state.dark?"dark":"light");}catch(e){}
    // The user taking over scrolling ends the pursuit — never fight a live hand.
    try{view.contentWindow.addEventListener("wheel",function(){chase=null;},{passive:true});}catch(e){}
    chaseViewport();
  });
  function select(id,noFocus){
    state.sel=id;
    empty.style.display="none";view.style.display="";
    if(view.dataset.sid!==id){
      rememberViewport();                       // #136: bank where we were leaving from
      view.dataset.sid=id;
      var y=viewport[id]||0;
      chase=y>0?{id:id,y:y,held:0,until:Date.now()+4000}:null;
      view.src=frameSrc(id);
    }
    var g=groupOf(id);
    document.getElementById("stripproj").textContent=g?g.label:"";
    render();
    if(!noFocus){var el=list.querySelector('[data-id="'+CSS.escape(id)+'"]');if(el)el.focus({preventScroll:true});}
  }
  // #113: hide/restore. The server persists the key and re-emits everything with
  // hidden flags; the click only toggles the key and re-polls.
  function ignore(key,add){
    fetch("/api/ignore?"+(add?"add":"remove")+"="+encodeURIComponent(key),{cache:"no-store"})
      .then(function(){poll();}).catch(function(){});
  }
  list.addEventListener("click",function(e){
    var hx=e.target.closest("[data-hide],[data-show]");
    if(hx){e.stopPropagation();var hk=hx.dataset.hide||hx.dataset.show;ignore(hk,!!hx.dataset.hide);return;}
    var at=e.target.closest("[data-attach]");
    if(at&&at.dataset.attach){
      e.stopPropagation();
      var row=at.closest(".row"), id=row&&row.dataset.id;
      // The poll rebuilds this node every couple of seconds, so the acknowledgement is
      // STATE the next render draws — not a textContent tweak that the next render erases.
      copyText(at.dataset.attach)
        .then(function(){state.copied={id:id,ok:true};})
        .catch(function(){state.copied={id:id,ok:false};})
        .then(function(){
          render();
          clearTimeout(window.__copyT);
          window.__copyT=setTimeout(function(){state.copied=null;render();},1600);
        });
      return;
    }
    var fk=e.target.closest("[data-fam]");
    if(fk){e.stopPropagation();var fkey=fk.dataset.fam;state.famOpen[fkey]=!state.famOpen[fkey];render();return;}
    var sm=e.target.closest(".showmore");
    if(sm){var k=sm.dataset.more;state.expanded[k]=!state.expanded[k];render();return;}
    var gh=e.target.closest(".ghead");
    if(gh){var k=gh.parentElement.dataset.g;state.collapsed[k]=!state.collapsed[k];render();return;}
    var row=e.target.closest(".row");
    if(row)select(row.dataset.id);
  });
  document.getElementById("collapseall").addEventListener("click",function(){
    state.groups.forEach(function(g){state.collapsed[g.kind+":"+g.label+":"+g.secondary]=true;});
    render();
  });
  document.getElementById("expandall").addEventListener("click",function(){
    state.collapsed={};
    render();
  });
  document.querySelectorAll("#filters button[data-f]").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll("#filters button[data-f]").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");state.filter=b.dataset.f;render();
    });
  });
  document.getElementById("hiddentoggle").addEventListener("click",function(){
    state.showHidden=!state.showHidden;render();
  });
  search.addEventListener("input",function(){state.q=search.value.trim().toLowerCase();render();});
  document.addEventListener("keydown",function(e){
    if(e.key==="/"&&document.activeElement!==search){e.preventDefault();search.focus();return;}
    if((e.key==="ArrowDown"||e.key==="ArrowUp")&&document.activeElement&&document.activeElement.classList.contains("row")){
      e.preventDefault();
      var rows=[].slice.call(list.querySelectorAll(".row"));
      var i=rows.indexOf(document.activeElement);
      var ni=e.key==="ArrowDown"?Math.min(rows.length-1,i+1):Math.max(0,i-1);
      if(rows[ni])select(rows[ni].dataset.id);
    }
  });

  // ── theme (the monitor's — one control themes both panes, §6.3) ──────────
  function applyTheme(dark,reframe){
    state.dark=dark;
    if(dark)root.setAttribute("data-theme","dark");else root.removeAttribute("data-theme");
    // #128: icon only — the split circle carries the meaning; the title says which
    // mode a click switches TO.
    var tb=document.getElementById("themebtn");
    tb.title="Theme — switch to "+(dark?"light":"dark")+" (rail and embedded view)";
    try{localStorage.setItem(THEME_KEY,dark?"dark":"light");}catch(e){}
    // Re-theme the live iframe in place (covers a child that navigated past the initial src).
    try{view.contentDocument.documentElement.setAttribute("data-theme",dark?"dark":"light");}catch(e){}
  }
  document.getElementById("themebtn").addEventListener("click",function(){applyTheme(!state.dark,true)});

  // ── rail hide (the strip carries the way back — never an overlay on the frame) ──
  document.getElementById("hiderail").addEventListener("click",function(){document.body.classList.add("railless")});
  document.getElementById("showrail").addEventListener("click",function(){document.body.classList.remove("railless")});
  document.getElementById("stripproj").addEventListener("click",function(){document.body.classList.remove("railless")});

  poll();
  setInterval(poll,2500);
})();
</script>
</body>
</html>
