[package]
name = "claude-monitor"
description = "What is happening on this machine: every agent session, one page, over loopback HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
claude-replay-core = { path = "../claude-replay-core" }
claude-replay-present = { path = "../claude-replay-present" }
claude-replay-html = { path = "../claude-replay-html" }
anyhow = "1"
serde_json = "1"

[features]
# Surface QoderWork session titles from its SQLite store (#119, reader from #106) so the rail
# shows "初筛候选人简历" instead of a bare UUID. Opt-in, NOT default: it pulls in bundled SQLite,
# and QoderWork's DB path is macOS-only — the release enables it only on the apple-darwin targets
# (a Linux binary would compile SQLite to reach a file that cannot exist). Local macOS check:
# `cargo run -p claude-monitor --features qoderwork-titles`.
default = []
qoderwork-titles = ["claude-replay-core/qoderwork-titles"]
