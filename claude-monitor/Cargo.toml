[package]
name = "claude-monitor"
description = "What is happening on this machine: every agent session, one page, over loopback HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library half (#133 control plane + #98 index): the send decisions, the consent store and the
# pairing token, one implementation of every security-relevant rule. `agent-monitor-v2` reused it
# until it retired (#s98); the binary and the tests use it now.
[lib]
name = "claude_monitor"
path = "src/lib.rs"

[[bin]]
name = "agent-monitor"
path = "src/main.rs"

[features]
default = []
codex-native = ["dep:claude-monitor-codex", "dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
claude-replay-core = { path = "../claude-replay-core" }
claude-replay-present = { path = "../claude-replay-present" }
claude-replay-html = { path = "../claude-replay-html" }
# mdrev's embedded viewer for the preview pane (#270), PINNED (#274): one released embedding kit,
# vendored and built into both monitors. It moves only by `scripts/vendor-mdrev.sh <version>`.
mdrev = { path = "../vendor/mdrev" }
anyhow = "1"
serde_json = "1"
claude-monitor-codex = { path = "../claude-monitor-codex", optional = true }
# Salted hash for the optional injection passcode (#133 grant gate). Small, audited; a
# security feature earns a crypto primitive rather than a hand-rolled hash.
sha2 = "0.10"
# The terminal QR code `--pair-phone` prints for a phone to scan (#11). Unicode rendering only:
# no image features, so no image dependencies.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# The html crate's signing key and its render and mask policies come from the state directory,
# which the tests redirect one at a time through a process-wide variable (`StateEnv`); with the
# real ones, the first stamp of a run minted a key file into whichever test's scratch held it,
# racing that test's cleanup (#s321). The tests get the html crate's fixed test values instead.
claude-replay-html = { path = "../claude-replay-html", features = ["hermetic-tests"] }
