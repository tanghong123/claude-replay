[package]
name = "claude-monitor"
description = "What is happening on this machine: every agent session, one page, over loopback HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A library half (#133 control plane + #98 index) so `agent-monitor-v2` reuses the send
# decisions, the consent store and the pairing token rather than reimplementing them — one
# implementation of every security-relevant rule, two front-ends.
[lib]
name = "claude_monitor"
path = "src/lib.rs"

[[bin]]
name = "agent-monitor"
path = "src/main.rs"

[dependencies]
claude-replay-core = { path = "../claude-replay-core" }
claude-replay-present = { path = "../claude-replay-present" }
claude-replay-html = { path = "../claude-replay-html" }
anyhow = "1"
serde_json = "1"
# Salted hash for the optional injection passcode (#133 grant gate). Small, audited; a
# security feature earns a crypto primitive rather than a hand-rolled hash.
sha2 = "0.10"
