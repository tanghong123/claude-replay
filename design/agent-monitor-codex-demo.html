document.getElementById('closePreview').onclick=()=>togglePreview(false);document.getElementById('previewBtn').onclick=()=>{if(S.preview){togglePreview(false);return}togglePreview(true);renderPreview()};document.getElementById('previewHead').onclick=e=>{const close=e.target.closest('[data-preview-tab-close]');if(close){const id=close.dataset.previewTabClose,index=S.previewTabs.indexOf(id);S.previewTabs=S.previewTabs.filter(x=>x!==id);if(S.artifact===id)S.artifact=S.previewTabs[Math.min(index,S.previewTabs.length-1)]||null;S.artifactMenu=false;renderPreview();return}const tab=e.target.closest('[data-preview-tab]');if(tab){S.artifact=tab.dataset.previewTab;S.artifactMenu=false;const a=sessionArtifacts(current()).find(x=>x.id===S.artifact);S.fileMode=['markdown','html'].includes(a?.kind)?'preview':'source';renderPreview()}};
document.getElementById('previewBody').onclick=e=>{
  const row=e.target.closest('[data-artifact]');if(row){openArtifact(row.dataset.artifact);return}
  const mode=e.target.closest('[data-mode]');if(mode){S.fileMode=mode.dataset.mode;S.artifactMenu=false;renderPreview();return}
  if(e.target.closest('[data-artifact-more]')){S.artifactMenu=!S.artifactMenu;renderPreview();return}
  const action=e.target.closest('[data-artifact-action]');if(!action){if(S.artifactMenu){S.artifactMenu=false;renderPreview()}return}
  const a=sessionArtifacts(current()).find(x=>x.id===S.artifact);if(!a)return;
  const kind=action.dataset.artifactAction;S.artifactMenu=false;
  if(kind==='diff'){S.fileMode='diff';renderPreview();return}
  if(kind==='finder'){toast('交互原型：将在 Finder 中显示 '+a.name);renderPreview();return}
  if(kind==='copy-path'){const done=()=>toast('已复制文件路径');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(a.path).then(done).catch(()=>toast(a.path));else toast(a.path);renderPreview();return}
  if(kind==='open-web'){window.open(a.url,'_blank','noopener');return}
  if(kind==='source'){const target=document.querySelector(`[data-block-index="${a.sourceIndex}"]`);if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('source-flash');setTimeout(()=>target.classList.remove('source-flash'),1300)}if(innerWidth<1180)togglePreview(false);else renderPreview();return}
};
const resizer=document.getElementById('resizer'),PREVIEW_MIN=340,PREVIEW_MAX=680,PREVIEW_DEFAULT=420;function previewMaxForViewport(){const sidebarWidth=document.querySelector('.sidebar')?.getBoundingClientRect().width||0;return Math.max(PREVIEW_MIN,Math.min(PREVIEW_MAX,innerWidth-sidebarWidth-485))}function setPreviewWidth(value,persist=true){const max=previewMaxForViewport(),w=Math.max(PREVIEW_MIN,Math.min(max,Number(value)||PREVIEW_DEFAULT));document.documentElement.style.setProperty('--preview',w+'px');resizer.setAttribute('aria-valuenow',Math.round(w));resizer.setAttribute('aria-valuemax',Math.round(max));if(persist)localStorage.setItem('am-demo-preview',w);return w}let resizeFrame=0,pendingPreviewWidth=PREVIEW_DEFAULT;function paintPreviewResize(){resizeFrame=0;setPreviewWidth(pendingPreviewWidth,false)}function finishPreviewResize(e){if(resizeFrame){cancelAnimationFrame(resizeFrame);resizeFrame=0}pendingPreviewWidth=setPreviewWidth(pendingPreviewWidth,true);resizer.classList.remove('dragging');app.classList.remove('resizing');resizer.onpointermove=null;resizer.onpointerup=null;resizer.onpointercancel=null;if(e?.pointerId!=null&&resizer.hasPointerCapture(e.pointerId))resizer.releasePointerCapture(e.pointerId)}resizer.setAttribute('role','separator');resizer.setAttribute('aria-orientation','vertical');resizer.setAttribute('aria-valuemin',PREVIEW_MIN);resizer.title='拖拽调整预览宽度，双击恢复默认';resizer.onpointerdown=e=>{e.preventDefault();resizer.setPointerCapture(e.pointerId);resizer.classList.add('dragging');app.classList.add('resizing');pendingPreviewWidth=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--preview'))||PREVIEW_DEFAULT;resizer.onpointermove=x=>{pendingPreviewWidth=innerWidth-x.clientX;if(!resizeFrame)resizeFrame=requestAnimationFrame(paintPreviewResize)};resizer.onpointerup=finishPreviewResize;resizer.onpointercancel=finishPreviewResize};resizer.ondblclick=()=>setPreviewWidth(PREVIEW_DEFAULT);resizer.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const current=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--preview'))||PREVIEW_DEFAULT;setPreviewWidth(e.key==='Home'?PREVIEW_MIN:e.key==='End'?previewMaxForViewport():current+(e.key==='ArrowLeft'?12:-12))};resizer.tabIndex=0;setPreviewWidth(localStorage.getItem('am-demo-preview')||PREVIEW_DEFAULT,false);addEventListener('resize',()=>{setPreviewWidth(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--preview'))||PREVIEW_DEFAULT,false);requestAnimationFrame(updateStickyProcessHeaders)},{passive:true});
document.getElementById('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';localStorage.setItem('am-demo-theme',dark?'dark':'light')};if(localStorage.getItem('am-demo-theme')==='dark')document.documentElement.dataset.theme='dark';
document.getElementById('mobileBack').onclick=()=>app.classList.remove('mobile-detail');const input=document.getElementById('composeInput');document.getElementById('sendBtn').onclick=()=>attemptSend();input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();attemptSend()}};function attemptSend(){const text=input.value.trim(),s=current();if(!text)return;if(s.terminal){S.pending=text;document.getElementById('confirmText').textContent=`消息会作为输入发送到 ${s.terminal}，并以该 Agent 当前的权限运行。`;document.getElementById('confirmLayer').classList.add('open')}else finishSend(text)}function closeConfirm(){document.getElementById('confirmLayer').classList.remove('open');S.pending=null}document.getElementById('cancelSend').onclick=closeConfirm;document.getElementById('confirmSend').onclick=()=>{const p=S.pending;closeConfirm();finishSend(p)};function finishSend(text){const s=current();s.blocks.push({t:'user',html:text});s.activityRev=Date.now();s.state='busy';s.reason='starting';s.detail='消息已发送，正在开始';markRead(s,false);input.value='';S.composerOpen=false;renderSession();setTimeout(()=>{document.getElementById('transcript').scrollTop=999999;maybeMarkCurrentRead()},20);toast('消息已发送到 '+s.title)}
let toastTimer;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
updateModes();renderTree();renderSession();requestAnimationFrame(maybeMarkCurrentRead);
/* Demo event: an off-screen running session finishes after the reading baseline exists. */
setTimeout(()=>{const s=sessions().find(x=>x.id==='s7');if(!s||s.state!=='busy')return;s.blocks.push({t:'assistant',html:'<p>状态映射已经整理完成；这条结果是在当前页面打开后到达的，因此会显示绿色“新结果”。</p>'});s.activityRev=Date.now();s.state='idle';s.reason='done';s.detail='状态映射已整理完成';s.activity='刚刚';if(s.id===S.selected){renderSession();requestAnimationFrame(maybeMarkCurrentRead)}else renderTree()},5200);
