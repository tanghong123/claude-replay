[package]
name = "claude-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "agent-replay"
description = "Interactive, read-only viewer for Claude Code session transcripts (like `claude --resume`, but you can't type)."
homepage = "https://github.com/tanghong123/claude-replay"
readme = "README.md"
keywords = ["claude", "tui", "ratatui", "transcript", "viewer"]
categories = ["command-line-utilities"]

[workspace]
members = [
    "claude-replay-core",
    "claude-replay-present",
    "claude-replay-tui",
    "claude-replay-html",
    "claude-replay-engine",
    "claude-replay-agents",
    "claude-monitor",
    "claude-monitor-fleet",
    "claude-monitor-v2",
    # In `members` but NOT in `default-members` below — that omission is the gate that keeps its
    # headless-Chrome dependency out of every ordinary build. See its Cargo.toml.
    "claude-replay-browser-tests",
]
# `cargo test` from the repo root must run EVERY crate (#63) — without this it
# silently tested only the root crate, skipping the library suites.
default-members = [
    ".",
    "claude-replay-core",
    "claude-replay-present",
    "claude-replay-tui",
    "claude-replay-html",
    "claude-replay-engine",
    "claude-replay-agents",
    "claude-monitor",
    "claude-monitor-fleet",
    "claude-monitor-v2",
]

# One version for the whole workspace, bumped in ONE place per release (#71).
[workspace.package]
version = "1.119.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tanghong123/claude-replay"

[lib]
name = "claude_replay"
path = "src/lib.rs"

[[bin]]
name = "agent-replay"
path = "src/main.rs"

[[bin]]
name = "agent-jdi"
path = "src/bin/agent-jdi.rs"

# `cargo binstall claude-replay` pulls the matching prebuilt tarball from the
# GitHub release instead of compiling. The CRATE keeps its name; the BINARY renamed to
# `agent-replay` (v1.101.0), so the asset name is spelled literally rather than
# templated from `{ name }` — that is what keeps `cargo binstall claude-replay`
# resolving. Assets carry the binary at the archive root (see release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/agent-replay-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
claude-replay-core = { path = "claude-replay-core" }
claude-replay-present = { path = "claude-replay-present", features = ["cli"] }
claude-replay-tui = { path = "claude-replay-tui" }
claude-replay-html = { path = "claude-replay-html" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true

[profile.dev]
debug = "line-tables-only"   # file:line in panics and test failures

[profile.dev.package."*"]
debug = false                # dependencies only — not my own crates

[profile.test]
debug = "line-tables-only"
