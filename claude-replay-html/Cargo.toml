[package]
name = "claude-replay-html"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The HTML frontend of claude-replay: self-contained exports, offline directory bundles, and the live loopback server. No terminal dependencies."

[dependencies]
claude-replay-core = { path = "../claude-replay-core" }
claude-replay-present = { path = "../claude-replay-present" }
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in this workspace's tree (claude-monitor), so the file-signature MAC adds no new
# third-party code — see html_export/sig.rs.
sha2 = "0.10"

[dev-dependencies]
# Tests drive the exporters through the real CLI surface (`Args::parse_from`).
claude-replay-present = { path = "../claude-replay-present", features = ["cli"] }
clap = { version = "4", features = ["derive"] }
# The browser-level viewport harness that drives headless Chrome lives in its own crate,
# `claude-replay-browser-tests` — outside `default-members`, so an ordinary `cargo test` no longer
# builds a ~250 MB dependency for a suite it does not run.

# The QoderWork title tripwire builds its fixture SQLite store directly; macOS-only,
# matching the reader it pins (see the agents crate's rusqlite note).
[target.'cfg(target_os = "macos")'.dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
