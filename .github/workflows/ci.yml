name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Frontend test dependencies
        run: pnpm --dir claude-monitor install --frozen-lockfile
      - name: Shared jdi-handoff installer
        run: sh tests/install_jdi_handoff.sh
      - name: Shared monitor-fleet installer
        run: sh tests/install_monitor_fleet.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # `--all`, as the test step below: the browser-test crate sits outside default-members so the
      # LOCAL gates never compile its heavy Chrome dep, which also kept it out of this lint, and three
      # lints went unseen in its scenarios (#318). CI compiles it anyway, so it is linted here.
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Native feature lint
        run: cargo clippy -p claude-monitor --features claude-monitor/codex-native --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      # The frontend's own contract checks. `cargo test` runs these too (via
      # claude-monitor/tests/ui_contract.rs), but that harness SKIPS when node is missing —
      # here it is mandatory, so a machine without node cannot quietly drop the check.
      - name: Native frontend unit tests
        run: pnpm --dir claude-monitor test
      - name: Frontend contract
        run: node claude-monitor/tests/ui_contract.mjs

  # The real-Chrome harness (claude-replay-browser-tests): hermetic fixtures, both pages,
  # the classic page as the reference. Visible on every PR; NOT yet a required check — it
  # becomes one once it has been stable for a while (CLAUDE.md, "Browser (real Chrome)").
  # `known_red_<task>` cases are queued bugs' repros and are skipped by the gate on purpose.
  #
  # The suite runs as LEGS on separate runners (#s448): every case takes `serial()`, so on one
  # runner the job is the sum of every file, and it had grown to about 110 min (scenarios 49,
  # browser_follow 23, the rest 34). The legs below are named by the `BROWSER_LEG_*` variables;
  # the `rest` leg runs every test target none of them names, read from tests/*.rs at run time,
  # so a new file always runs somewhere. The scenarios halves use one string as a filter and as a
  # `--skip`, so they are exact complements. `browser (real Chrome)` below is the one result.
  browser:
    name: browser leg (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [scenarios-app, scenarios-rest, follow, misc, rest]
    env:
      BROWSER_LEG_SCENARIOS: scenarios
      BROWSER_LEG_FOLLOW: browser_follow
      BROWSER_LEG_MISC: sandbox records_by_turn quoted_replies mermaid
      # The scenarios halves: the cases whose name holds this string, then every other one.
      SCENARIOS_SPLIT: app_
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One leg saves the cache the others restore: the rest leg, which builds the most.
          save-if: ${{ matrix.leg == 'rest' }}
      - name: Chrome
        run: google-chrome --version
      # The mdrev cases (#270) run the pinned mdrev's CLI (#274) — the monitor's notes, and
      # `mdrev-cli conform` itself — which needs node 20 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Frontend test dependencies
        run: pnpm --dir claude-monitor install --frozen-lockfile
      - name: Build the monitors
        run: cargo build --release -p claude-monitor --features claude-monitor/codex-native
      - name: Native runtime and monitor contracts
        if: matrix.leg == 'rest'
        run: cargo test -p claude-monitor-codex -p claude-monitor --features claude-monitor/codex-native
      - name: Browser suite (${{ matrix.leg }})
        # headless_chrome honours $CHROME, then searches PATH for google-chrome-stable & co.
        env:
          CHROME: /usr/bin/google-chrome
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          targets() { for t in $1; do printf -- '--test %s ' "$t"; done; }
          case "$LEG" in
            scenarios-app)  args="$(targets "$BROWSER_LEG_SCENARIOS") -- --ignored --skip known_red $SCENARIOS_SPLIT" ;;
            scenarios-rest) args="$(targets "$BROWSER_LEG_SCENARIOS") -- --ignored --skip known_red --skip $SCENARIOS_SPLIT" ;;
            follow)         args="$(targets "$BROWSER_LEG_FOLLOW") -- --ignored --skip known_red" ;;
            misc)           args="$(targets "$BROWSER_LEG_MISC") -- --ignored --skip known_red" ;;
            rest)
              named=" $(for v in $(compgen -v BROWSER_LEG_); do printf '%s ' "${!v}"; done)"
              rest=""
              for f in claude-replay-browser-tests/tests/*.rs; do
                t="$(basename "$f" .rs)"
                case "$named" in *" $t "*) ;; *) rest="$rest $t" ;; esac
              done
              echo "the rest leg runs:$rest"
              args="--lib $(targets "$rest") -- --ignored --skip known_red" ;;
            *) echo "unknown leg $LEG"; exit 1 ;;
          esac
          echo "cargo test -p claude-replay-browser-tests $args"
          cargo test -p claude-replay-browser-tests $args

  # The browser suite's one result, under the name the legs replaced: it passes only when every
  # leg passed (a leg skipped or cancelled fails it too).
  browser-result:
    name: browser (real Chrome)
    if: always()
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed
        env:
          LEGS: ${{ needs.browser.result }}
        run: |
          echo "the legs: $LEGS"
          test "$LEGS" = success

  version:
    name: version guard
    # #200: the workspace version never moves backwards along main, and a release commit names
    # its own version — refused here even when the release ran outside scripts/release.sh.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tags
        run: git fetch --tags --force --quiet origin
      - name: The workspace version is at or above the highest tag, and a release commit names it
        run: sh scripts/release-check.sh

  guard:
    name: secrets · blocked emails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so gitleaks + the email scan see every commit
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Block corporate / non-project emails
        run: |
          # Must match .githooks/pre-push. Extend as needed.
          BLOCKED_EMAIL_DOMAINS="alibaba-inc.com"
          # Commits KNOWINGLY accepted with a blocked committer email (PR #16; owner's call,
          # 2026-08-12). The merge happened server-side, where no pre-push hook runs, and the
          # owner chose to keep public history rather than rewrite it. Exempted by full sha so
          # the guard still fails on any NEW leak — including new commits by the same author.
          ALLOWED_SHAS="988c2b96a030ef18d890842cfce465072e0933a8 76ab2bc3409d9e5c3388346003f75b7d311a93bd ca9d16975ec1d783ca9426ae87175a2b60736ce8 59fc30e3daa9c98086e1f05dcd83f5dbf0b1a925 82db604d6b4320c00b79cab549af8b5f8793f5b9"
          fail=0
          for dom in $BLOCKED_EMAIL_DOMAINS; do
            hits="$(git log --all --format='%H %ae %ce' | grep -iF "@$dom" || true)"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              sha="${line%% *}"
              case " $ALLOWED_SHAS " in *" $sha "*) continue ;; esac
              echo "::error::A commit author/committer email at @$dom is present: $line"
              fail=1
            done <<-EOF
          $hits
          EOF
            if git grep -qiI "@$dom" -- . ':!.githooks' ':!.github'; then
              echo "::error::Blocked email @$dom appears in tracked file contents."
              fail=1
            fi
          done
          exit $fail
