[package]
name = "claude-replay-core"
version = "1.0.0"
edition = "2021"
description = "Agent-agnostic transcript parser/replay engine behind claude-replay (Claude Code & Codex sessions). No TUI/HTML/CLI dependencies."
license = "MIT"
repository = "https://github.com/tanghong123/claude-replay"
keywords = ["claude", "codex", "transcript", "parser"]
categories = ["parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
