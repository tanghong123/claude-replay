[package]
name = "claude-replay-present"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Presentation-support layer for claude-replay: session residency cache, shared text/highlight helpers, and the viewer options type. Frontend-agnostic (no terminal, no HTML)."

[features]
# Enables clap parsing on `Args` (the CLI binary turns this on; library consumers
# building their own frontend stay clap-free).
cli = ["dep:clap"]

[dependencies]
claude-replay-core = { path = "../claude-replay-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
# Types only (Span/Style are the shared span vocabulary both frontends consume;
# the HTML exporter adapts them) — no terminal backend.
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fancy-regex backend keeps syntect pure-Rust (no oniguruma/C build).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
