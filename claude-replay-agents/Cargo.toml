[package]
name = "claude-replay-agents"
version.workspace = true
edition = "2021"
description = "The built-in agent adapters for claude-replay (Claude Code, Codex, QoderWork) over the claude-replay-engine seam."
license = "MIT"
repository = "https://github.com/tanghong123/claude-replay"
keywords = ["claude", "codex", "transcript", "parser"]
categories = ["parser-implementations"]

[dependencies]
claude-replay-engine = { path = "../claude-replay-engine", version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# QoderWork keeps its session titles in SQLite, not in the transcript, so reading them needs a
# database — and since ~July 2026 QoderWork stopped writing the plaintext `<sid>-session.json`
# sidecar, so the database is the ONLY title source for new sessions. macOS-only (QoderWork is
# an Electron app that ships there; `db_path()` is a macOS path), so a Linux build never
# compiles the one C dependency in an otherwise pure-Rust workspace. This was an opt-in
# `qoderwork-titles` feature, which meant a plain `cargo build` on macOS silently showed every
# new QoderWork session as its cryptic workspace-dir leaf — a local build must not be quietly
# worse than the release. `bundled` so the build never depends on the host's libsqlite3.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
claude-replay-core = { path = "../claude-replay-core" }
