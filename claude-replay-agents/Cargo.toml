[package]
name = "claude-replay-agents"
version.workspace = true
edition = "2021"
description = "The built-in agent adapters for claude-replay (Claude Code, Codex, QoderWork) over the claude-replay-engine seam."
license = "MIT"
repository = "https://github.com/tanghong123/claude-replay"
keywords = ["claude", "codex", "transcript", "parser"]
categories = ["parser-implementations"]

[dependencies]
claude-replay-engine = { path = "../claude-replay-engine", version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reuse the workspace Markdown grammar to identify literal source spans, without rendering.
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = "1"
# #s272: HMAC-SHA256 for a relayed message's signature, written out over `sha2` as
# claude-replay-html's `sig.rs` does (`sha2` is already in this workspace; `hmac` is not).
sha2 = "0.10"
url = "2"

# QoderWork keeps its session titles in SQLite, not in the transcript, so reading them needs a
# database — and since ~July 2026 QoderWork stopped writing the plaintext `<sid>-session.json`
# sidecar, so the database is the only title source for new QoderWork sessions. Antigravity
# also uses SQLite for its conversation catalog on all platforms.
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
claude-replay-core = { path = "../claude-replay-core" }
