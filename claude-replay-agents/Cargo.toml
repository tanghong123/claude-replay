[package]
name = "claude-replay-agents"
version.workspace = true
edition = "2021"
description = "The built-in agent adapters for claude-replay (Claude Code, Codex, QoderWork) over the claude-replay-engine seam."
license = "MIT"
repository = "https://github.com/tanghong123/claude-replay"
keywords = ["claude", "codex", "transcript", "parser"]
categories = ["parser-implementations"]

[dependencies]
claude-replay-engine = { path = "../claude-replay-engine", version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
claude-replay-core = { path = "../claude-replay-core" }
