[package]
name = "claude-monitor-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The v2 monitor: one app-shell over every agent session on this machine — no iframe, one search box, artifacts served over HTTP."

# A SEPARATE compatibility app retained for rollout comparison. Both binaries now default to
# the precise app shell and retain a Classic rollback URL, while this crate keeps its own
# port/cache root so they can still run side by side against real sessions. Both use the SAME
# public backend and control plane.
[[bin]]
name = "agent-monitor-v2"
path = "src/main.rs"

[dependencies]
claude-replay-core = { path = "../claude-replay-core" }
claude-replay-html = { path = "../claude-replay-html" }
# The session index and the control plane (#98/#133), from v1's library half. v2 is a second
# FRONT-END, not a second implementation: one `Index`, one consent store, one pairing token.
claude-monitor = { path = "../claude-monitor" }
claude-replay-present = { path = "../claude-replay-present" }
anyhow = "1"
serde_json = "1"
