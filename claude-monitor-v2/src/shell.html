<style>
/* ── monitor v2 shell ────────────────────────────────────────────────────────────────
   Injected INTO the session document rather than wrapping it in a frame. The rail is
   `position: fixed`, so the transcript keeps the DOCUMENT scroller — which is what lets
   every `window.scrollY` in export.js (the follow/pin/landing/search contract, ~27 sites)
   keep working untouched, and is the whole reason this shape was chosen over nesting the
   stream in an overflow container.

   Living inside that document also means the viewer's theme tokens are already in scope, so
   the rail is themed by whatever the page is — v1 had to carry its own copy. Only the two the
   viewer does not define are declared here. */
:root { --v2-rail-w: {{RAIL_W}}px; --amber: #b8860b; --accent: #6d4fa1; }
#v2rail {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--v2-rail-w); z-index: 60;
  display: flex; flex-direction: column; background: var(--bg);
  border-right: 1px solid var(--border); font-family: var(--sans);
}
#v2head { flex: none; padding: 9px 12px; border-bottom: 1px solid var(--border); }
#v2titlebar { display: flex; align-items: center; gap: 9px; height: 30px; }
/* The shell switch: both frontends stay supported while the app shell is validated, so each
   one carries a visible way across. `/api/ui` remembers it; `?ui=` overrides for one request. */
#v2appshell { margin-left: auto; font: inherit; font-size: 10px; font-weight: 600; letter-spacing: .02em;
  color: var(--dim); background: none; border: 1px solid var(--border); border-radius: 5px;
  padding: 1px 6px; cursor: pointer; }
#v2appshell:hover { color: var(--fg); }
#v2appshell[disabled] { opacity: .4; pointer-events: none; }
#v2mark { flex: none; font: 600 13px var(--sans); color: var(--fg); letter-spacing: -.01em; }
#v2mark i { font-style: normal; color: var(--faint); font: 9.5px var(--mono); }
#v2scan { margin-left: auto; font: 9.5px var(--mono); color: var(--faint); display: inline-flex; align-items: center; gap: 5px; }
#v2scan i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tool); animation: v2pulse 2.4s infinite; }
@keyframes v2pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
#v2find { margin-top: 7px; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--panel); }
#v2find:focus-within { border-color: var(--accent); }
#v2find > span { color: var(--faint); font-size: 12px; }
#v2q { flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font: 13px var(--sans); color: var(--fg); height: 28px; }
#v2hits { font: 9.5px var(--mono); color: var(--faint); white-space: nowrap; }
/* Hit stepping, beside the count. The page's own ▲▼ live in the box this one replaces, so
   these click THOSE — one search, one set of handlers, two ways in. */
.v2nav { flex: none; font: 9px var(--mono); color: var(--faint); cursor: pointer; padding: 0 2px; }
.v2nav:hover { color: var(--fg); }
#v2list { flex: 1; overflow-y: auto; padding: 4px 0 16px; }

.v2group { margin-top: 6px; }
.v2ghead { display: flex; align-items: center; gap: 8px; padding: 6px 12px 3px; cursor: pointer; }
.v2chev { flex: none; color: var(--faint); font-size: 9px; transition: transform .12s; }
.v2group.col .v2chev { transform: rotate(-90deg); }
.v2glabels { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.v2glabel { font: 700 13.5px var(--sans); color: var(--fg); letter-spacing: -.01em; }
.v2gsec { font: 9.5px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2gmeta { flex: none; font: 9.5px var(--mono); color: var(--muted); background: var(--card);
  border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; margin-left: auto; }
.v2gdot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
.v2gdot.growing { background: var(--tool); }
.v2gdot.idle { background: var(--amber); }
.v2gdot.finished { background: var(--gut); }

.v2row { display: block; margin: 3px 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; outline: none; text-decoration: none; color: inherit; }
.v2row:hover { background: var(--hover); }
.v2row[aria-current="true"] { background: var(--hover); border-color: var(--accent); }
.v2row.grow { background: rgba(46,125,85,.08); border-color: rgba(46,125,85,.32); }
.v2r1 { display: flex; align-items: center; gap: 9px; }
.v2dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
.v2dot.growing { background: var(--tool); animation: v2pulse 2.2s infinite; }
.v2dot.idle { background: var(--amber); }
.v2dot.finished { background: var(--gut); }
.v2name { flex: 1; min-width: 0; font: 12px var(--sans); color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2badge { flex: none; font: 8.5px/1 var(--mono); font-weight: 600; border-radius: 3px; padding: 2px 3px; color: #fff; }
.v2badge.a-claude { background: var(--kw); }
.v2badge.a-codex { background: var(--link); }
.v2badge.a-qoderwork { background: var(--tool); }
.v2badge.a-other { background: var(--gut); }
.v2r2 { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; padding-left: 18px; }
.v2counters { min-width: 0; font: 10.5px var(--mono); color: var(--faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2counters.unvisited { opacity: .55; font-style: italic; }
.v2age { flex: none; font: 10.5px var(--mono); color: var(--faint); }
/* A dot that a live process NAMED is solid; one inferred from file recency is hollow, so the
   rail never implies proof it does not have. */
.v2dot.growing.unproven { background: transparent; border: 2px solid var(--tool); }
.v2fork { flex: none; font: 9px var(--mono); color: var(--kw); border: 1px solid var(--kw);
  border-radius: 4px; padding: 0 5px; opacity: .75; }
/* #133 compose. `inject` marks a live pane that still needs consent, `armed` one already
   granted — the same three-state vocabulary v1's rail uses, so the two read alike. */
.v2send { flex: none; font: 12px/1 var(--sans); color: var(--faint); border: none; background: none;
  cursor: pointer; padding: 1px 4px; border-radius: 5px; opacity: 0; }
.v2row:hover .v2send { opacity: .75; }
.v2send:hover { opacity: 1; background: var(--hover); color: var(--fg); }
.v2send.inject, .v2send.armed { opacity: .85; color: var(--kw); }
.v2send.armed { color: var(--tool); }
/* The bar is FIXED and outside the list on purpose: the list re-renders every few seconds,
   and a compose box inside it would lose whatever was half-typed. */
#v2compose { position: fixed; left: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px));
  z-index: 70; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 11px; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
#v2chead { display: flex; align-items: center; gap: 8px; font: 12px var(--sans); color: var(--muted); margin-bottom: 6px; }
#v2cto { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#v2crevoke { flex: none; font: 11px var(--sans); color: var(--link); cursor: pointer; text-decoration: underline; }
#v2cx { border: none; background: transparent; color: var(--faint); cursor: pointer; font-size: 15px; line-height: 1; }
#v2ctext, #v2cpass { width: 100%; box-sizing: border-box; font: 13px var(--sans); padding: 7px 9px;
  border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--fg); }
#v2ctext { resize: vertical; }
#v2cpass { margin-top: 6px; }
#v2ctext:focus, #v2cpass:focus { outline: none; border-color: var(--accent); }
#v2cfoot { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
#v2cmsg { flex: 1; min-width: 0; font: 11px var(--sans); color: var(--faint); }
#v2cmsg.err { color: var(--delfg); }
#v2cmsg.ok { color: var(--tool); }
#v2csend { font: 12px var(--sans); padding: 5px 12px; border: 1px solid var(--accent); border-radius: 7px;
  background: transparent; color: var(--fg); cursor: pointer; }
#v2csend:disabled { opacity: .5; cursor: default; }
.v2x { flex: none; font: 13px/1 var(--sans); color: var(--faint); border: none; background: none;
  cursor: pointer; padding: 1px 5px; border-radius: 5px; opacity: 0; }
.v2row:hover .v2x, .v2ghead:hover .v2x { opacity: .6; }
.v2x:hover { opacity: 1; background: var(--hover); color: var(--fg); }
.v2row.hid { opacity: .45; }
.v2row.hid .v2x { opacity: .7; }
#v2hidden { margin: 6px 12px; font: 10.5px var(--sans); color: var(--link); cursor: pointer; }
#v2hidden:hover { text-decoration: underline; }
/* Drag the rail's edge to resize; persisted, like v1's #114. */
#v2grip { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 61; }
#v2rail { position: fixed; }
#v2empty { padding: 40px 16px; color: var(--faint); font: 12px var(--sans); text-align: center; }

/* Making room for the rail is the PAGE's job, not this file's: v2 asks for the inset with
   `PageChrome::host_inset` and export.css applies it, beside the layout it offsets. What used
   to be here — padding `body`, offsetting `#topbar`, nudging `#newbadge` — was this shell
   reaching into the renderer's internal selectors on knowledge it had no right to (that
   `.layout` centres itself), which an export.css restructure would have broken silently. */
</style>
<aside id="v2rail">
  <div id="v2head">
    <div id="v2titlebar">
      <div id="v2mark">agent-monitor <i>v2 · {{VERSION}}</i></div>
      <button id="v2appshell" title="Switch to the app-shell interface — remembered until you switch back">App</button>
      <div id="v2scan"><i></i><span id="v2count"></span></div>
    </div>
    <div id="v2find"><span>&#9906;</span><input id="v2q" placeholder="Search sessions and transcript  ( / )" autocomplete="off"><span id="v2hits"></span><span class="v2nav" id="v2prev" title="Previous match (⇧⏎)">&#9650;</span><span class="v2nav" id="v2next" title="Next match (⏎)">&#9660;</span></div>
  </div>
  <div id="v2list"></div>
</aside>
<div id="v2compose" hidden>
  <div id="v2chead"><span id="v2cto"></span><span id="v2crevoke" hidden>revoke consent</span><button id="v2cx" title="Cancel (Esc)">&times;</button></div>
  <textarea id="v2ctext" rows="3"></textarea>
  <input id="v2cpass" type="password" autocomplete="off" placeholder="passcode" hidden>
  <div id="v2cfoot"><span id="v2cmsg"></span><button id="v2csend">Send prompt</button></div>
</div>
<script>
{{SHARED}}
</script>
<script>
(function () {
  "use strict";
  var listEl = document.getElementById("v2list");
  var q = document.getElementById("v2q");
  var hits = document.getElementById("v2hits");
  var countEl = document.getElementById("v2count");
  var current = new URLSearchParams(location.search).get("session") || "";
  document.getElementById("v2appshell").onclick = function () {
    var b = this; b.disabled = true;
    fetch("/api/ui?set=app", { cache: "no-store" }).then(function () { location.href = "/"; }).catch(function () { b.disabled = false; });
  };
  // #133: the write routes need a token, so the compose affordance exists only when paired —
  // offering it unpaired would offer a dead end. The server substitutes the flag.
  var PAIRED = {{PAIRED}};
  // Two transports, and the row says which one it is:
  //  • resume — a FINISHED claude/codex session; /api/send resumes it.
  //  • inject — a LIVE, PROVEN tmux pane; the index marks it `injectable`, and /api/send
  //    injects only with standing consent.
  // Constraint 2: a session whose PROJECT has another live session offers neither — with two
  // live sessions in one cwd we cannot tell which drives it, so we refuse rather than pick.
  function canResume(r) {
    return PAIRED && r.state === "finished" && !r.projActive &&
      (r.agent === "claude" || r.agent === "codex");
  }
  function canInject(r) { return PAIRED && !!r.injectable; }
  function canCompose(r) { return canResume(r) || canInject(r); }
  var groups = [];
  var showHidden = false;
  var collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem("v2col") || "{}"); } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function badgeClass(a) {
    return "v2badge a-" + (/^(claude|codex|qoderwork)$/.test(a) ? a : "other");
  }

  function render(filter) {
    var f = (filter || "").toLowerCase();
    listEl.textContent = "";
    var shown = 0, total = 0;
    groups.forEach(function (g) {
      var rows = g.rows.filter(function (r) {
        if (!window.__shared.rowVisible(r, { showHidden: showHidden })) return false;
        return !f || (r.name + " " + r.agent + " " + g.label).toLowerCase().indexOf(f) >= 0;
      });
      total += g.rows.length;
      if (!rows.length) return;
      shown += rows.length;
      var box = el("div", "v2group" + (collapsed[g.label] ? " col" : ""));
      var head = el("div", "v2ghead");
      head.appendChild(el("span", "v2chev", "▾"));
      var dotk = g.growing ? "growing" : (g.idle ? "idle" : "finished");
      head.appendChild(el("span", "v2gdot " + dotk));
      var labels = el("div", "v2glabels");
      labels.appendChild(el("div", "v2glabel", g.label));
      labels.appendChild(el("div", "v2gsec", g.secondary));
      head.appendChild(labels);
      head.appendChild(el("span", "v2gmeta", rows.length + (g.growing ? " · " + g.growing + " live" : "")));
      head.onclick = function () {
        collapsed[g.label] = !collapsed[g.label];
        try { localStorage.setItem("v2col", JSON.stringify(collapsed)); } catch (e) {}
        render(q.value);
      };
      box.appendChild(head);
      if (!collapsed[g.label]) {
        rows.forEach(function (r) {
          var a = el("a", "v2row" + (r.state === "growing" ? " grow" : "") + (r.hidden ? " hid" : ""));
          a.href = "/?ui=classic&session=" + encodeURIComponent(r.id);
          if (r.id === current) a.setAttribute("aria-current", "true");
          var r1 = el("div", "v2r1");
          // `conf` is the index's own word for how the process↔session link was made:
          // "unconfirmed" is the cwd heuristic, and the dot stays hollow for it rather than
          // implying a proof the data does not have.
          r1.appendChild(el("span", "v2dot " + r.state + (r.conf === "unconfirmed" ? " unproven" : "")));
          r1.appendChild(el("span", "v2name", r.name));
          if (r.isFork) r1.appendChild(el("span", "v2fork", "fork"));
          r1.appendChild(el("span", badgeClass(r.agent), r.agent.slice(0, 2).toUpperCase()));
          if (canCompose(r)) {
            var send = el("button", "v2send" + (canInject(r) ? (r.consented ? " armed" : " inject") : ""), "✎");
            send.title = canInject(r)
              ? "Send a prompt into this live tmux pane" + (r.consented ? " (consent granted)" : " (asks consent first)")
              : "Send a prompt — resumes this finished session";
            send.onclick = function (ev) {
              ev.preventDefault(); ev.stopPropagation();
              openCompose(r.id, r.name, canInject(r) ? "tmux" : "resume", !!r.consented);
            };
            r1.appendChild(send);
          }
          var x = el("button", "v2x", r.hidden ? "↺" : "✕");
          x.title = r.hidden ? "Restore" : "Hide this session";
          x.onclick = function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            var p = r.hidden ? "remove" : "add";
            fetch("/api/ignore?" + p + "=" + encodeURIComponent(r.ignoreKey || ("s:" + r.id))).then(load);
          };
          r1.appendChild(x);
          var r2 = el("div", "v2r2");
          r2.appendChild(el("span", "v2counters" + (r.turns == null ? " unvisited" : ""),
            r.turns == null ? "not yet opened" : counterText(r)));
          r2.appendChild(el("span", "v2age", r.activity + " ago"));
          a.appendChild(r1); a.appendChild(r2);
          box.appendChild(a);
        });
      }
      listEl.appendChild(box);
    });
    countEl.textContent = shown + (f ? "/" + total : "") + " sessions";
    var nhid = 0;
    groups.forEach(function (g) { g.rows.forEach(function (r) { if (r.hidden) nhid++; }); });
    if (nhid) {
      var t = el("div", null, (showHidden ? "Hide" : "Show") + " hidden (" + nhid + ")");
      t.id = "v2hidden";
      t.onclick = function () { showHidden = !showHidden; render(q.value); };
      listEl.appendChild(t);
    }
    if (!shown) {
      var e = el("div", null, groups.length ? emptyText() : "Scanning…");
      e.id = "v2empty";
      listEl.appendChild(e);
    }
  }

  // ONE search box (goal 2). It filters the session list AND drives the transcript search —
  // by writing into the page's own `#q` and firing its `input`, so every search behaviour the
  // viewer has (scoping, highlighting, hit stepping) runs unchanged and unforked. The page
  // renders its own field hidden for us (`host_search` chrome), so the two boxes read as one.
  // The list's empty state, when one box serves two kinds of result: a query that names no
  // session is not a dead end if it is finding things in the transcript — say which.
  function emptyText() {
    return q.value && hits.textContent
      ? "No session matches — searching this transcript instead."
      : "No session matches.";
  }

  function onQuery() {
    var v = q.value;
    render(v);
    var inner = document.getElementById("q");
    if (inner && inner.value !== v) {
      inner.value = v;
      inner.dispatchEvent(new Event("input", { bubbles: true }));
    }
    syncHits();
  }
  // The page counts its hits asynchronously, so read the count when it CHANGES rather than
  // straight after typing — and say, where the empty list would otherwise read as a dead end,
  // that the same query is still searching the transcript.
  function syncHits() {
    var c = document.getElementById("qcount");
    hits.textContent = q.value && c ? c.textContent : "";
    var empty = document.getElementById("v2empty");
    if (empty) empty.textContent = emptyText();
  }
  var qcount = document.getElementById("qcount");
  if (qcount) {
    new MutationObserver(syncHits).observe(qcount, {
      childList: true, characterData: true, subtree: true
    });
  }
  q.addEventListener("input", onQuery);
  // Step the transcript's hits by clicking the page's own ▲▼ — the handlers are already
  // there, and reaching for them beats re-deriving `stepHit` on this side.
  function step(id) {
    var b = document.getElementById(id);
    if (b) b.click();
    syncHits();
  }
  document.getElementById("v2prev").addEventListener("click", function () { step("qprev"); });
  document.getElementById("v2next").addEventListener("click", function () { step("qnext"); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); step(e.shiftKey ? "qprev" : "qnext"); }
    if (e.key === "Escape") q.blur();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q &&
        !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      // Stop it here: the page binds `/` too, and would move focus to the field we hid.
      e.preventDefault(); e.stopPropagation(); q.focus();
    }
  }, true);

  // "792 turns · 10.2k calls · 17 sub · ~$4,626" — the same facts v1 shows, from this
  // monitor's own durable entry. A session it has never opened has none, and says so.
  function counterText(r) {
    var out = [r.turns + (r.turns === 1 ? " turn" : " turns")];
    if (r.tools) out.push(compact(r.tools) + " calls");
    if (r.subs) out.push(r.subs + " sub");
    if (r.cost) out.push("~$" + (r.cost >= 100 ? Math.round(r.cost).toLocaleString() : r.cost.toFixed(2)));
    return out.join(" · ");
  }
  function compact(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); }

  // Rail width, dragged from its edge and remembered (v1 #114).
  var grip = el("div", null); grip.id = "v2grip";
  document.getElementById("v2rail").appendChild(grip);
  try {
    var w = localStorage.getItem("v2railw");
    if (w) document.documentElement.style.setProperty("--v2-rail-w", w + "px");
  } catch (e) {}
  grip.addEventListener("mousedown", function (e) {
    e.preventDefault();
    function move(ev) {
      var w = Math.max(220, Math.min(560, ev.clientX));
      document.documentElement.style.setProperty("--v2-rail-w", w + "px");
      try { localStorage.setItem("v2railw", String(w)); } catch (x) {}
    }
    function up() { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  // ── #133 compose ────────────────────────────────────────────────────────────────
  // Two transports; the backend picks by liveness and the UI sets expectations:
  //  • resume — a FINISHED session; /api/send resumes it (permissions skipped).
  //  • tmux   — a LIVE pane; /api/send injects, but ONLY with standing CONSENT. An
  //    unconsented pane makes the button read "Grant & send": one click grants
  //    (/api/consent) then sends. The grant step is deliberate — it is where the RISK is
  //    stated, because injected text is input to a live agent running with its permissions.
  // Same-origin POSTs carry the cmauth cookie and Origin automatically, so `deny_write`
  // passes on a paired monitor and refuses everywhere else.
  var compose = (function () {
    var bar = document.getElementById("v2compose");
    var to = document.getElementById("v2cto");
    var text = document.getElementById("v2ctext");
    var pass = document.getElementById("v2cpass");
    var msg = document.getElementById("v2cmsg");
    var sendBtn = document.getElementById("v2csend");
    var revoke = document.getElementById("v2crevoke");
    var target = null, mode = "resume", consented = false;

    function updateButton() {
      sendBtn.textContent = mode === "tmux" ? (consented ? "Send to pane" : "Grant & send") : "Send prompt";
    }
    function updateRevoke() { revoke.hidden = !(mode === "tmux" && consented); }
    function revealPass() { pass.hidden = false; pass.focus(); }
    function hidePass() { pass.hidden = true; pass.value = ""; }
    function close() { bar.hidden = true; target = null; hidePass(); }
    function asJson(r) { return r.json().catch(function () { return { ok: false, error: "HTTP " + r.status }; }); }
    function postSend(prompt) {
      return fetch("/api/send?target=" + encodeURIComponent(target),
        { method: "POST", body: prompt, cache: "no-store" }).then(asJson);
    }
    // The passcode rides the BODY, never the query string — a query can be logged.
    function postGrant(passcode) {
      return fetch("/api/consent?target=" + encodeURIComponent(target),
        { method: "POST", body: passcode || "", cache: "no-store" }).then(asJson);
    }
    function doSend(prompt) {
      sendBtn.disabled = true; msg.className = ""; msg.textContent = "sending…";
      postSend(prompt).then(function (d) {
        sendBtn.disabled = false;
        if (d && d.ok) {
          msg.className = "ok";
          msg.textContent = mode === "tmux" ? "sent into the pane" : "sent — the session is resuming";
          setTimeout(close, 900); load();
        } else if (d && d.code === "no-consent") {
          // The grant lapsed between opening and sending (the pid changed) — re-offer it.
          consented = false; updateButton(); updateRevoke();
          msg.className = "err"; msg.textContent = "this pane needs consent — press “Grant & send”";
        } else {
          msg.className = "err"; msg.textContent = (d && d.error) || "could not send";
        }
      }).catch(function () {
        sendBtn.disabled = false; msg.className = "err"; msg.textContent = "could not reach the monitor";
      });
    }
    function send() {
      var prompt = text.value.trim();
      if (!prompt || !target) return;
      if (mode !== "tmux" || consented) { doSend(prompt); return; }
      sendBtn.disabled = true; msg.className = "";
      msg.textContent = pass.hidden ? "granting…" : "authorising…";
      postGrant(pass.value.trim()).then(function (g) {
        sendBtn.disabled = false;
        if (g && g.code === "passcode-required") {
          revealPass(); msg.className = ""; msg.textContent = "Enter your passcode to authorise this pane."; return;
        }
        if (g && g.code === "bad-passcode") {
          revealPass(); msg.className = "err"; msg.textContent = "Incorrect passcode."; pass.select(); return;
        }
        if (g && g.code === "locked") {
          msg.className = "err"; msg.textContent = g.error || "too many attempts — wait a moment."; return;
        }
        if (!g || !g.ok) { msg.className = "err"; msg.textContent = (g && g.error) || "could not grant consent"; return; }
        consented = true; hidePass(); updateButton(); updateRevoke();
        doSend(prompt);
      }).catch(function () {
        sendBtn.disabled = false; msg.className = "err"; msg.textContent = "could not reach the monitor";
      });
    }
    revoke.addEventListener("click", function () {
      if (!target) return;
      fetch("/api/consent?op=revoke&target=" + encodeURIComponent(target), { method: "POST", cache: "no-store" })
        .then(asJson).then(function (d) {
          consented = false; updateButton(); updateRevoke();
          msg.className = ""; msg.textContent = (d && d.ok) ? "consent revoked" : "could not revoke";
          load();
        });
    });
    sendBtn.addEventListener("click", send);
    document.getElementById("v2cx").addEventListener("click", close);
    // Enter sends (chat convention); Shift+Enter — or ⌘/Ctrl+Enter — makes a newline. The
    // handler stops propagation so the transcript page's own keybindings never see it.
    function onKey(e) {
      if (e.key === "Escape") { close(); return; }
      if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); send(); }
      e.stopPropagation();
    }
    text.addEventListener("keydown", onKey);
    pass.addEventListener("keydown", onKey);

    return function (id, name, m, isConsented) {
      target = id; mode = (m === "tmux" ? "tmux" : "resume"); consented = !!isConsented;
      to.textContent = (mode === "tmux" ? "Inject into: " : "Send to: ") + (name || id);
      text.placeholder = mode === "tmux"
        ? "Type a prompt — it is pasted into the live tmux pane and submitted"
        : "Send a prompt — the session resumes and runs it (permissions skipped)";
      msg.className = "";
      msg.textContent = (mode === "tmux" && !consented)
        ? "Runs in the LIVE agent with its permissions. “Grant & send” authorises this pane until it restarts."
        : "";
      hidePass(); updateButton(); updateRevoke();
      bar.hidden = false; text.value = ""; text.focus();
    };
  })();
  function openCompose(id, name, mode, consented) { compose(id, name, mode, consented); }

  function load() {
    fetch("/api/sessions")
      .then(function (r) { return r.json(); })
      .then(function (d) { groups = d.groups || []; render(q.value); })
      .catch(function () { groups = []; render(""); });
  }
  load();
  setInterval(load, 5000);
})();
</script>
