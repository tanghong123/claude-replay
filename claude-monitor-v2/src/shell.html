<style>
/* ── monitor v2 shell ────────────────────────────────────────────────────────────────
   Injected INTO the session document, not wrapped around it in a frame. The rail is
   `position: fixed`, so the transcript keeps the DOCUMENT scroller — which is what lets
   every `window.scrollY` in export.js (the follow/pin/landing/search contract, ~27 sites)
   keep working untouched. That is the whole reason this composition was chosen over
   nesting the stream in an overflow container. */
:root { --v2-rail-w: 300px; }
#v2rail {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--v2-rail-w); z-index: 60;
  display: flex; flex-direction: column; background: var(--bg);
  border-right: 1px solid var(--border); font-family: var(--sans);
}
#v2head { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--border); }
#v2mark { font: 600 12.5px var(--sans); color: var(--fg); letter-spacing: .01em; }
#v2mark span { color: var(--faint); font: 10px var(--mono); }
/* ONE box. It filters the session list, and — when a session is open — drives that
   session's own search too, so there is never a second place to type. */
#v2find {
  margin-top: 9px; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--panel);
}
#v2find span { color: var(--faint); font-size: 12px; }
#v2q {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font: 13px var(--sans); color: var(--fg); height: 28px;
}
#v2hits { font: 10px var(--mono); color: var(--faint); white-space: nowrap; }
#v2list { flex: 1; overflow-y: auto; padding: 4px 0 16px; }
.v2row {
  display: block; padding: 7px 12px; cursor: pointer; border-left: 2px solid transparent;
  text-decoration: none; color: inherit;
}
.v2row:hover { background: var(--panel); }
.v2row[aria-current="true"] { border-left-color: var(--tool); background: var(--panel); }
.v2title {
  font: 12px var(--sans); color: var(--fg); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.v2meta {
  margin-top: 2px; font: 10px var(--mono); color: var(--faint); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
#v2empty { padding: 40px 16px; color: var(--faint); font: 12px var(--sans); text-align: center; }
/* Make room for the rail in everything the view pins to the viewport. */
#topbar { left: var(--v2-rail-w) !important; }
#stream, #sidebar { margin-left: var(--v2-rail-w); }
</style>
<aside id="v2rail">
  <div id="v2head">
    <div id="v2mark">agent-monitor <span>v2 · {{VERSION}}</span></div>
    <div id="v2find"><span>⌕</span><input id="v2q" placeholder="Search sessions and transcript  ( / )" autocomplete="off"><span id="v2hits"></span></div>
  </div>
  <div id="v2list"></div>
</aside>
<script>
(function () {
  "use strict";
  var listEl = document.getElementById("v2list");
  var q = document.getElementById("v2q");
  var hits = document.getElementById("v2hits");
  var current = new URLSearchParams(location.search).get("session") || "";
  var rows = [];

  function render(filter) {
    var f = (filter || "").toLowerCase();
    listEl.textContent = "";
    var shown = 0;
    rows.forEach(function (s) {
      var hay = (s.title + " " + s.project + " " + s.agent).toLowerCase();
      if (f && hay.indexOf(f) < 0) return;
      shown++;
      var a = document.createElement("a");
      a.className = "v2row";
      a.href = "/?session=" + encodeURIComponent(s.id);
      if (s.id === current) a.setAttribute("aria-current", "true");
      var t = document.createElement("div");
      t.className = "v2title";
      t.textContent = s.title || s.id;
      var m = document.createElement("div");
      m.className = "v2meta";
      m.textContent = s.agent + " · " + s.project;
      a.appendChild(t); a.appendChild(m);
      listEl.appendChild(a);
    });
    if (!shown) {
      var e = document.createElement("div");
      e.id = "v2empty";
      e.textContent = rows.length ? "No session matches." : "Scanning…";
      listEl.appendChild(e);
    }
  }

  // The single box: filter the rail, and mirror the query into the open session's own
  // search so one input covers both panes (goal 2 — there is no second box to focus).
  function onQuery() {
    var v = q.value;
    render(v);
    var inner = document.getElementById("q");
    if (inner && inner.value !== v) {
      inner.value = v;
      inner.dispatchEvent(new Event("input", { bubbles: true }));
    }
    var count = document.getElementById("qcount");
    hits.textContent = v && count ? count.textContent : "";
  }
  q.addEventListener("input", onQuery);
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); q.focus();
    }
  }, true);

  fetch("/api/sessions")
    .then(function (r) { return r.json(); })
    .then(function (d) { rows = d.sessions || []; render(q.value); })
    .catch(function () { rows = []; render(""); });
})();
</script>
