<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session list host</title>
<!-- A test host (#s430 stage 2): a page of the case's own that mounts the session list alone, as a
     host app would, on the monitor's origin, with no app shell and no session view. The case answers
     this page itself through the browser (harness::answer_in_browser); the monitor serves only its
     own modules and routes. The page carries nothing of the app's: the list builds its own markup
     (stage 3) in the empty element it is given, and with no `place` it draws its controls and the
     filter's sheet in a head of its own at its top. What the list says reaches `window.__host`: each
     `onOpen`, each `onIndex` and each toast. The page loads the list's own stylesheet alone (stage 3),
     every rule of which hangs on #sessionList, and nothing of the app's. -->
<link rel="stylesheet" href="/monitor-ui/session-list.css">
<style>
/* The host's own rules keep to its own elements. */
.host-bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; gap: 8px; align-items: center; padding: 0 12px; }
.host-pane { position: fixed; top: 40px; left: 0; bottom: 0; width: 320px; overflow: auto; display: flex; }
/* The element the host gives the list: a column filling the pane, which the list's stylesheet leaves to
   its host (in the app it is `display: contents`, the app placing the list in its sidebar). */
.host-pane > #sessionList { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<header class="host-bar"><span id="hostLabel">A host</span></header>
<div class="host-pane" id="hostPane"><div class="session-list" id="sessionList"></div></div>
<script type="module">
// `holds`: the host keeps the reader where they are (a draft to keep, say) and opens nothing.
const host = window.__host = { mounted: false, error: null, opened: [], indexed: 0, toasts: [], holds: false };
addEventListener("error", event => { host.error = host.error || String(event.message); });
try {
  const { mountSessionList } = await import("/monitor-ui/session-list-view.js");
  const list = window.__list = mountSessionList(document.querySelector("#hostPane > #sessionList"), {
    toast: message => host.toasts.push(message),
    // A host opens the session it hears and takes it as the list's selection, as the app does,
    // unless it holds the reader.
    onOpen: event => { host.opened.push(event); if (!host.holds) window.__list.select(event.id); },
    onIndex: () => { host.indexed += 1; },
  });
  list.start();
  host.mounted = true;
} catch (error) {
  host.error = String(error && error.stack || error);
}
</script>
</body>
</html>
